// ===== app/util.js =====
// ==== app/util.js ====
// 全モジュール共通のヘルパー。名前は全体で1つのグローバルスコープを共有するため一意に保つこと。

function uid(prefix) {
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 日付は 'YYYY-MM-DD' 文字列で保持。TZの影響を避けるためローカル日付として手動パースする。
function parseDate(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3]);
}

function fmtDate(d) {
  if (!d) return '';
  const y = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const da = String(d.getDate()).padStart(2, '0');
  return `${y}-${mo}-${da}`;
}

function todayDate() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

// 2日付間の暦日差(d2 - d1)。同日=0。
function dayDiff(d1, d2) {
  const a = Date.UTC(d1.getFullYear(), d1.getMonth(), d1.getDate());
  const b = Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate());
  return Math.round((b - a) / 86400000);
}

function addDays(d, n) {
  const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  r.setDate(r.getDate() + n);
  return r;
}

function isWeekend(d) {
  const w = d.getDay();
  return w === 0 || w === 6;
}

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function fmtRangeLabel(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// トースト通知
function toast(msg) {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 1800);
  setTimeout(() => el.remove(), 2150);
}


// ===== app/holidays.js =====
// ==== app/holidays.js ====
// 日本の祝日を内蔵し、稼働日計算に自動適用する(SPEC.md 8章)。
// 出典・更新方法は SPEC.md の要確認事項。ここでは 2024〜2030 の内閣府公表データ + 振替休日を静的に持つ。
// 稼働日 = 平日(月〜金)かつ祝日でない日。

const Holidays = (() => {
  // 'YYYY-MM-DD' の基準日（国民の祝日。振替休日は下で自動算出）
  const BASE = [
    // 2024
    '2024-01-01','2024-01-08','2024-02-11','2024-02-12','2024-02-23','2024-03-20','2024-04-29',
    '2024-05-03','2024-05-04','2024-05-05','2024-05-06','2024-07-15','2024-08-11','2024-08-12',
    '2024-09-16','2024-09-22','2024-09-23','2024-10-14','2024-11-03','2024-11-04','2024-11-23',
    // 2025
    '2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24','2025-03-20','2025-04-29',
    '2025-05-03','2025-05-04','2025-05-05','2025-05-06','2025-07-21','2025-08-11','2025-09-15',
    '2025-09-23','2025-10-13','2025-11-03','2025-11-23','2025-11-24',
    // 2026
    '2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03',
    '2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22',
    '2026-09-23','2026-10-12','2026-11-03','2026-11-23',
    // 2027
    '2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29',
    '2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11','2027-09-20','2027-09-23',
    '2027-10-11','2027-11-03','2027-11-23',
    // 2028
    '2028-01-01','2028-01-10','2028-02-11','2028-02-23','2028-03-20','2028-04-29','2028-05-03',
    '2028-05-04','2028-05-05','2028-07-17','2028-08-11','2028-09-18','2028-09-22','2028-10-09',
    '2028-11-03','2028-11-23',
    // 2029
    '2029-01-01','2029-01-08','2029-02-11','2029-02-12','2029-02-23','2029-03-20','2029-04-29',
    '2029-04-30','2029-05-03','2029-05-04','2029-05-05','2029-07-16','2029-08-11','2029-09-17',
    '2029-09-23','2029-09-24','2029-10-08','2029-11-03','2029-11-23',
    // 2030
    '2030-01-01','2030-01-14','2030-02-11','2030-02-23','2030-03-20','2030-04-29','2030-05-03',
    '2030-05-04','2030-05-05','2030-05-06','2030-07-15','2030-08-11','2030-08-12','2030-09-16',
    '2030-09-23','2030-10-14','2030-11-03','2030-11-04','2030-11-23',
  ];

  const set = new Set(BASE);

  // 振替休日: 祝日が日曜のとき、その後の最初の非祝日を休日にする。
  const sundayHolidays = BASE.filter(s => parseDate(s).getDay() === 0);
  for (const s of sundayHolidays) {
    let d = addDays(parseDate(s), 1);
    while (set.has(fmtDate(d))) d = addDays(d, 1);
    set.add(fmtDate(d));
  }

  function isHoliday(d) { return set.has(fmtDate(d)); }
  function isWorkingDay(d) { return !isWeekend(d) && !isHoliday(d); }

  // start〜end(両端含む)の稼働日数。start>end は 0。
  function countWorkingDays(start, end) {
    if (!start || !end || dayDiff(start, end) < 0) return 0;
    let n = 0;
    let d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    while (dayDiff(d, end) >= 0) {
      if (isWorkingDay(d)) n++;
      d = addDays(d, 1);
    }
    return n;
  }

  // start から数えて稼働日 count 日分の期間の終了日を返す(start自身が稼働日なら1日目)。
  function endAfterWorkingDays(start, count) {
    if (!start || count < 1) return start;
    let remaining = count;
    let d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    // start が非稼働日なら次の稼働日まで送る
    while (!isWorkingDay(d)) d = addDays(d, 1);
    while (remaining > 1) {
      d = addDays(d, 1);
      if (isWorkingDay(d)) remaining--;
    }
    return d;
  }

  // date が非稼働日なら、次の稼働日へ送る。
  function nextWorkingDay(date) {
    let d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    while (!isWorkingDay(d)) d = addDays(d, 1);
    return d;
  }

  return { isHoliday, isWorkingDay, countWorkingDays, endAfterWorkingDays, nextWorkingDay };
})();


// ===== app/db.js =====
// ==== app/db.js ====
// 生の IndexedDB を Promise でラップ。ラッパーライブラリは使わない。
// 変更は必ず DB.put / DB.remove を経由する(履歴ロギングもここで行う)。

const DB = (() => {
  const DB_NAME = 'ganttchart';
  const DB_VERSION = 1;
  // projectId でインデックスするドメインストア。
  const DOMAIN_STORES = ['schedules', 'milestones', 'dependencies', 'comments', 'notes', 'historyLog'];
  // 履歴追跡の対象(CLAUDE.md / SPEC.md)。schedules にはタスクも含まれる。
  const HISTORY_DOMAINS = ['schedules', 'milestones', 'comments'];

  let _db = null;

  function open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('projects')) {
          db.createObjectStore('projects', { keyPath: 'id' });
        }
        for (const s of DOMAIN_STORES) {
          if (!db.objectStoreNames.contains(s)) {
            const store = db.createObjectStore(s, { keyPath: 'id' });
            store.createIndex('projectId', 'projectId', { unique: false });
          }
        }
        if (!db.objectStoreNames.contains('meta')) {
          db.createObjectStore('meta', { keyPath: 'key' });
        }
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }

  function tx(store, mode) { return _db.transaction(store, mode).objectStore(store); }

  function reqP(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function getAll(store) { return reqP(tx(store, 'readonly').getAll()); }

  function getAllByProject(store, projectId) {
    return reqP(tx(store, 'readonly').index('projectId').getAll(projectId));
  }

  function get(store, id) { return reqP(tx(store, 'readonly').get(id)); }

  async function put(store, record, historyMeta) {
    await reqP(tx(store, 'readwrite').put(record));
    if (historyMeta && HISTORY_DOMAINS.includes(store)) {
      await _log(record.projectId, historyMeta);
    }
    return record;
  }

  async function remove(store, id, historyMeta) {
    let projectId = historyMeta && historyMeta.projectId;
    await reqP(tx(store, 'readwrite').delete(id));
    if (historyMeta && HISTORY_DOMAINS.includes(store)) {
      await _log(projectId, historyMeta);
    }
  }

  // 生トランザクションでの一括削除(カスケード)。onsuccess 連鎖で await を挟まない。
  function bulkRemove(store, ids) {
    if (!ids.length) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const t = _db.transaction(store, 'readwrite');
      const os = t.objectStore(store);
      t.oncomplete = () => resolve();
      t.onerror = () => reject(t.error);
      for (const id of ids) os.delete(id);
    });
  }

  function _log(projectId, meta) {
    const entry = {
      id: uid('h'),
      projectId,
      at: Date.now(),
      action: meta.action || 'change',
      label: meta.label || '',
    };
    return reqP(tx('historyLog', 'readwrite').put(entry));
  }

  // meta ストア(選択中プロジェクトIDなど)
  function getMeta(key) { return reqP(tx('meta', 'readonly').get(key)); }
  function setMeta(key, value) { return reqP(tx('meta', 'readwrite').put({ key, value })); }

  return {
    open, getAll, getAllByProject, get, put, remove, bulkRemove,
    getMeta, setMeta, HISTORY_DOMAINS,
  };
})();


// ===== app/state.js =====
// ==== app/state.js ====
// 共有可変ストア + タグスコープの pub/sub。

// 選択中プロジェクトのドメインデータ(プロジェクト切替のたびに全再読み込み)。
const state = {
  projects: [],       // 全プロジェクトのメタ(一覧用)
  project: null,      // 選択中プロジェクト
  schedules: [],      // schedule/subschedule/task を統合した木ノード
  milestones: [],
  dependencies: [],
  history: [],        // 選択中プロジェクトの historyLog
};

// UI専用の一時状態(再レンダリングで消えてはいけないもの)。
const uiState = {
  selectedId: null,       // 選択中ツリーノード
  collapsed: {},          // { nodeId: true } 折りたたみ
  granularity: 'day',     // day/week/month/quarter
  undoStack: [],          // 直近のスナップショット(元に戻す用)
};

const Store = (() => {
  const subs = [];  // { tags:Set, fn }

  function subscribe(tags, fn) {
    subs.push({ tags: new Set(tags), fn });
  }

  function _notify(tags) {
    const t = new Set(tags);
    for (const s of subs) {
      for (const tag of t) {
        if (s.tags.has(tag)) { s.fn(); break; }
      }
    }
  }

  function setState(patch, tags) {
    Object.assign(state, patch);
    _notify(tags || []);
  }

  function setUiState(patch, tags) {
    Object.assign(uiState, patch);
    _notify(tags || []);
  }

  // タグ指定なしで、全レンダー関数を呼ぶ(プロジェクト切替など全面更新時)。
  function renderAll() {
    const seen = new Set();
    for (const s of subs) {
      if (seen.has(s.fn)) continue;
      seen.add(s.fn);
      s.fn();
    }
  }

  return { subscribe, setState, setUiState, renderAll };
})();


// ===== app/ui.js =====
// ==== app/ui.js ====
// 共有モーダル / サイドパネルのホスト。呼び出しのたびにホストの中身を完全に置き換えるため、
// モーダル本体の内部要素にリスナーをアタッチしても蓄積しない。

const UI = (() => {
  function openModal(html, opts) {
    opts = opts || {};
    const host = document.getElementById('modalHost');
    host.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    host.classList.remove('hidden');

    const modal = host.firstElementChild;
    const form = modal.querySelector('form');

    function close() { host.classList.add('hidden'); host.innerHTML = ''; }

    // 閉じる系
    host.onclick = (e) => { if (e.target === host) close(); };
    modal.querySelectorAll('[data-close]').forEach(b => b.onclick = close);

    if (form && opts.onSubmit) {
      form.onsubmit = (e) => {
        e.preventDefault();
        const result = opts.onSubmit(form, modal);
        if (result !== false) close();  // false のときだけ開いたまま(バリデーションエラー)
      };
    }
    if (opts.onOpen) opts.onOpen(modal);
    const first = modal.querySelector('input, select, textarea');
    if (first) first.focus();
    return { close, modal };
  }

  function openPanel(html, opts) {
    opts = opts || {};
    const host = document.getElementById('panelHost');
    host.innerHTML = `<div class="side-panel">${html}</div>`;
    host.classList.remove('hidden');
    const panel = host.firstElementChild;
    function close() { host.classList.add('hidden'); host.innerHTML = ''; }
    host.onclick = (e) => { if (e.target === host) close(); };
    panel.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
    if (opts.onOpen) opts.onOpen(panel);
    return { close, panel };
  }

  function confirm(message, opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      const { close } = openModal(`
        <div class="modal-head"><h2>${escapeHtml(opts.title || '確認')}</h2></div>
        <div class="modal-body"><p>${escapeHtml(message)}</p></div>
        <div class="modal-foot">
          <button class="btn" data-act="cancel">キャンセル</button>
          <button class="btn ${opts.danger ? 'danger' : 'primary'}" data-act="ok">${escapeHtml(opts.okLabel || 'OK')}</button>
        </div>`, {
        onOpen(modal) {
          modal.querySelector('[data-act="ok"]').onclick = () => { close(); resolve(true); };
          modal.querySelector('[data-act="cancel"]').onclick = () => { close(); resolve(false); };
        }
      });
    });
  }

  return { openModal, openPanel, confirm };
})();


// ===== app/projects.js =====
// ==== app/projects.js ====
// プロジェクトの CRUD と切り替え。切替のたびにドメインデータを全再読み込みする。

const Projects = (() => {

  async function loadAll() {
    const projects = await DB.getAll('projects');
    projects.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    Store.setState({ projects }, []);
    return projects;
  }

  // 選択中プロジェクトのドメインデータを IndexedDB から全ロードして state に載せる。
  async function select(projectId) {
    const project = await DB.get('projects', projectId);
    if (!project) return;
    const [schedules, milestones, dependencies, history] = await Promise.all([
      DB.getAllByProject('schedules', projectId),
      DB.getAllByProject('milestones', projectId),
      DB.getAllByProject('dependencies', projectId),
      DB.getAllByProject('historyLog', projectId),
    ]);
    history.sort((a, b) => b.at - a.at);
    await DB.setMeta('currentProjectId', projectId);
    document.body.dataset.mode = project.mode || 'assist';
    Store.setUiState({ selectedId: null, undoStack: [] }, []);
    Store.setState({ project, schedules, milestones, dependencies, history }, []);
    Store.renderAll();
  }

  async function create(name, mode, templateKey) {
    const now = Date.now();
    const project = { id: uid('p'), name: name || '新しいプロジェクト', mode: mode || 'assist', createdAt: now, updatedAt: now };
    await DB.put('projects', project);
    if (templateKey && templateKey !== 'blank') {
      await Assist.applyTemplate(project.id, templateKey);
    }
    await loadAll();
    await select(project.id);
    return project;
  }

  async function rename(name) {
    if (!state.project) return;
    const p = { ...state.project, name, updatedAt: Date.now() };
    await DB.put('projects', p);
    await loadAll();
    Store.setState({ project: p }, ['header']);
  }

  async function setMode(mode) {
    if (!state.project || state.project.mode === mode) return;
    const p = { ...state.project, mode, updatedAt: Date.now() };
    await DB.put('projects', p);
    document.body.dataset.mode = mode;
    Store.setState({ project: p }, []);
    Store.renderAll();
  }

  async function touch() {
    // ドメイン変更時に updatedAt を進める(一覧の並び順のため)。
    if (!state.project) return;
    const p = { ...state.project, updatedAt: Date.now() };
    await DB.put('projects', p);
    state.project = p;
  }

  async function remove(projectId) {
    // 関連ドメインを全削除してからプロジェクトを消す。
    for (const store of ['schedules', 'milestones', 'dependencies', 'comments', 'notes', 'historyLog']) {
      const recs = await DB.getAllByProject(store, projectId);
      await DB.bulkRemove(store, recs.map(r => r.id));
    }
    await DB.remove('projects', projectId);
    const projects = await loadAll();
    if (state.project && state.project.id === projectId) {
      if (projects.length) await select(projects[0].id);
      else await select(await ensureOne());
    }
  }

  // プロジェクトが1つも無ければ既定を1つ作る。
  async function ensureOne() {
    const projects = await DB.getAll('projects');
    if (projects.length) return projects.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0].id;
    const p = await create('はじめてのプロジェクト', 'assist', 'teamdev');
    return p.id;
  }

  return { loadAll, select, create, rename, setMode, touch, remove, ensureOne };
})();


// ===== app/schedules.js =====
// ==== app/schedules.js ====
// スケジュール木(スケジュール→サブスケジュール→タスク、最大3階層)の CRUD と描画。
// タスクは独立ストアを持たず、schedules 内の「子を持たない末端ノード」。

const Schedules = (() => {
  const LEVEL_NAME = ['スケジュール', 'サブスケジュール', 'タスク'];
  const MAX_LEVEL = 2; // 0,1,2 の3階層

  // --- 木の操作 ---
  function childrenOf(parentId) {
    return state.schedules
      .filter(n => n.parentId === parentId)
      .sort((a, b) => a.order - b.order);
  }
  function byId(id) { return state.schedules.find(n => n.id === id); }

  function levelOf(node) {
    let lv = 0, p = node.parentId;
    while (p) { lv++; const par = byId(p); p = par ? par.parentId : null; }
    return lv;
  }
  function hasChildren(id) { return state.schedules.some(n => n.parentId === id); }

  // 表示番号 "1.2.3" を毎回算出(保存しない)。
  function computeNumbering() {
    const map = {};
    function walk(parentId, prefix) {
      childrenOf(parentId).forEach((n, i) => {
        const num = prefix ? `${prefix}.${i + 1}` : `${i + 1}`;
        map[n.id] = num;
        walk(n.id, num);
      });
    }
    walk(null, '');
    return map;
  }

  // 折りたたみを反映した表示順の平坦リスト(スケジュール→サブスケジュール→タスクの入れ子順)。
  // タスクはガント/ツリーにも表示しつつ、タスク管理パネルからも編集できる(併用)。
  function flattenForDisplay() {
    const rows = [];
    function walk(parentId, level) {
      for (const n of childrenOf(parentId)) {
        const kids = hasChildren(n.id);
        rows.push({ node: n, level, hasChildren: kids });
        if (kids && !uiState.collapsed[n.id]) walk(n.id, level + 1);
      }
    }
    walk(null, 0);
    return rows;
  }

  // --- ステータス集計(子から自動)---
  function effectiveStatus(node) {
    const kids = childrenOf(node.id);
    if (!kids.length) return node.status || 'todo';
    const states = kids.map(effectiveStatus);
    if (states.every(s => s === 'done')) return 'done';
    if (states.every(s => s === 'todo')) return 'todo';
    return 'doing';
  }

  // --- 期間の集計(親は子の min/max。葉は自身の日付)---
  function effectiveSpan(node) {
    const kids = childrenOf(node.id);
    if (!kids.length) {
      const s = parseDate(node.startDate), e = parseDate(node.endDate);
      if (s && e) return { start: s, end: e };
      return null;
    }
    let start = null, end = null;
    for (const k of kids) {
      const sp = effectiveSpan(k);
      if (!sp) continue;
      if (!start || sp.start < start) start = sp.start;
      if (!end || sp.end > end) end = sp.end;
    }
    return start && end ? { start, end } : null;
  }

  // --- レンダリング: 左ツリー ---
  function renderTree() {
    const host = document.getElementById('treeList');
    if (!state.project) { host.innerHTML = ''; return; }
    const rows = flattenForDisplay();
    if (!rows.length) {
      host.innerHTML = `<div class="tree-empty">まだスケジュールがありません。<br>「＋ スケジュール」から始めましょう。</div>`;
      return;
    }
    const nums = computeNumbering();
    host.innerHTML = rows.map(r => {
      const n = r.node;
      // WBSの点はガントのバー色と揃える: タスク(lv2)はステータス濃淡、それ以外は階層色。
      const dotClass = r.level === 2 ? effectiveStatus(n) : `lv${r.level}`;
      const sp = effectiveSpan(n);
      const meta = sp ? `${fmtRangeLabel(sp.start)}–${fmtRangeLabel(sp.end)}` : '日付未設定';
      // 子を持つノード(スケジュール/タスク持ちサブスケジュール)は展開用の三角。タスクは葉。
      const twist = r.hasChildren
        ? `<button class="twist" data-toggle="${n.id}">${uiState.collapsed[n.id] ? '▶' : '▼'}</button>`
        : `<span class="twist leaf">•</span>`;
      // サブスケジュール(level 1)には常時表示のタスク管理チップ。
      const persistent = r.level === 1
        ? `<button class="task-chip" data-tasks="${n.id}" title="タスク管理を開く">☑ ${childrenOf(n.id).length}</button>`
        : '';
      // level 0,1 は子を追加できる(スケジュール→サブ、サブ→タスク)。
      const hoverAdd = r.level < MAX_LEVEL
        ? `<button class="icon-btn" data-addchild="${n.id}" title="${LEVEL_NAME[r.level + 1]}を追加">＋</button>` : '';
      return `
        <div class="tree-row lv${r.level} ${uiState.selectedId === n.id ? 'selected' : ''}" data-id="${n.id}"
             style="padding-left:${8 + r.level * 16}px">
          ${twist}
          <span class="status-dot ${dotClass}"></span>
          <span class="num">${nums[n.id] || ''}</span>
          <span class="name lv${r.level}" data-edit="${n.id}">${escapeHtml(n.name)}</span>
          <span class="meta">${meta}</span>
          ${persistent}
          <span class="row-actions">
            ${hoverAdd}
            <button class="icon-btn" data-edit="${n.id}" title="編集">✎</button>
            <button class="icon-btn" data-del="${n.id}" title="削除">🗑</button>
          </span>
        </div>`;
    }).join('');
  }

  // --- 例文(アシストモードで消えないヒント)---
  function examples(level) {
    return [
      { name: '「定義」「設計」「実装」「フォロー」', note: '例: このフェーズのゴールを一言で' },
      { name: '「機能要件定義」「基本設計書作成」', note: '例: 成果物・工程の単位で分ける' },
      { name: '「ヒアリングメモ作成」「要求一覧作成」', note: '例: 実際に手を動かす作業' },
    ][level] || { name: '', note: '' };
  }

  // --- 追加/編集モーダル ---
  function openEditor(opts) {
    // opts: { id } 既存編集 / { parentId, level } 新規
    const editing = opts.id ? byId(opts.id) : null;
    const level = editing ? levelOf(editing) : opts.level;
    const parentId = editing ? editing.parentId : opts.parentId;
    const isLeaf = editing ? !hasChildren(editing.id) : true;
    const assist = document.body.dataset.mode === 'assist';
    const eg = examples(level);
    const n = editing || {};

    let start = n.startDate || '';
    let end = n.endDate || '';
    // 新規の子は、初期値として親の日程を受け継ぐ(サブスケジュール←スケジュール等)。
    if (!editing && parentId) {
      const parent = byId(parentId);
      const psp = parent
        ? (effectiveSpan(parent) || (parent.startDate && parent.endDate
            ? { start: parseDate(parent.startDate), end: parseDate(parent.endDate) } : null))
        : null;
      if (psp) { start = fmtDate(psp.start); end = fmtDate(psp.end); }
    }
    let dur = '';
    if (start && end) dur = Holidays.countWorkingDays(parseDate(start), parseDate(end));

    const egHint = (txt) => assist ? `<span class="eg-hint">${escapeHtml(txt)}</span>` : '';
    const statusSeg = isLeaf ? `
      <div class="field">
        <label>状態</label>
        <div class="seg" data-status="${n.status || 'todo'}">
          <button type="button" data-st="todo" class="${(n.status||'todo')==='todo'?'on todo':''}">未着手</button>
          <button type="button" data-st="doing" class="${n.status==='doing'?'on doing':''}">進行中</button>
          <button type="button" data-st="done" class="${n.status==='done'?'on done':''}">完了</button>
        </div>
      </div>` : `<div class="field"><label>状態</label><p style="font-size:12px;color:var(--text-muted);margin:0">子タスクから自動集計されます(現在: ${statusLabel(effectiveStatus(editing))})</p></div>`;

    // 先行タスク(依存関係)— 既存の葉タスクを編集するときだけ表示
    let depsField = '';
    if (editing && isLeaf) {
      const preds = Dependencies.predecessorsOf(editing.id);
      const others = Dependencies.leafTasks().filter(t => t.id !== editing.id);
      if (others.length) {
        const predOpts = others.map(t =>
          `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:4px">
             <input type="checkbox" name="pred" value="${t.id}" ${preds.includes(t.id) ? 'checked' : ''} style="width:auto;height:auto">
             ${escapeHtml(t.name)}
           </label>`).join('');
        depsField = `<div class="field"><label>先行タスク(これが終わってから開始)</label>
          <div style="max-height:120px;overflow:auto;border:1px solid var(--border);border-radius:7px;padding:8px">${predOpts}</div>
          ${assist ? '<span class="eg-hint">チェックすると、先行タスクの終了に合わせて自動で日程が調整されます</span>' : ''}</div>`;
      }
    }

    const dateFields = isLeaf ? `
      <div class="field row2">
        <div><label>開始日</label><input type="date" name="startDate" value="${start}">${egHint('例: 2026-08-01')}</div>
        <div><label>期間(稼働日)</label><input type="number" name="duration" min="1" value="${dur}">${egHint('例: 10')}</div>
      </div>
      <div class="field"><label>終了日(自動計算 / 直接入力可)</label><input type="date" name="endDate" value="${end}">${egHint('土日・祝日を除いて計算します')}</div>
    ` : `<div class="field"><label>期間</label><p style="font-size:12px;color:var(--text-muted);margin:0">子の期間から自動で決まります。</p></div>`;

    UI.openModal(`
      <div class="modal-head"><h2>${editing ? LEVEL_NAME[level] + 'を編集' : LEVEL_NAME[level] + 'を追加'}</h2></div>
      <form>
        <div class="modal-body">
          <div class="field">
            <label>${LEVEL_NAME[level]}名</label>
            <input name="name" value="${escapeHtml(n.name || '')}" placeholder="${assist ? '' : LEVEL_NAME[level] + '名'}" autocomplete="off">
            ${egHint('例: ' + eg.name)}
          </div>
          ${dateFields}
          <div class="field">
            <label>担当者</label>
            <input name="assignee" value="${escapeHtml(n.assignee || '')}" autocomplete="off">
            ${egHint('例: 田中さん')}
          </div>
          ${statusSeg}
          ${depsField}
          <div class="field">
            <label>メモ・目的</label>
            <textarea name="note">${escapeHtml(n.note || '')}</textarea>
            ${egHint(eg.note)}
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn" data-close>キャンセル</button>
          <button type="submit" class="btn primary">${editing ? '保存' : '追加'}</button>
        </div>
      </form>
    `, {
      onOpen(modal) {
        // ステータスセグメント
        const seg = modal.querySelector('.seg');
        if (seg) seg.querySelectorAll('button').forEach(b => b.onclick = () => {
          seg.dataset.status = b.dataset.st;
          seg.querySelectorAll('button').forEach(x => x.className = '');
          b.className = 'on ' + b.dataset.st;
        });
        // 日付 ↔ 期間の相互自動計算
        const sIn = modal.querySelector('[name=startDate]');
        const dIn = modal.querySelector('[name=duration]');
        const eIn = modal.querySelector('[name=endDate]');
        if (sIn && dIn && eIn) {
          const fromDur = () => {
            const s = parseDate(sIn.value); const d = parseInt(dIn.value, 10);
            if (s && d >= 1) eIn.value = fmtDate(Holidays.endAfterWorkingDays(s, d));
          };
          const fromEnd = () => {
            const s = parseDate(sIn.value); const e = parseDate(eIn.value);
            if (s && e && dayDiff(s, e) >= 0) dIn.value = Holidays.countWorkingDays(s, e);
          };
          sIn.onchange = () => { if (dIn.value) fromDur(); else fromEnd(); };
          dIn.oninput = fromDur;
          eIn.onchange = fromEnd;
        }
      },
      onSubmit(form) {
        const name = form.name.value.trim();
        if (!name) { toast('名称を入力してください'); return false; }
        const seg = form.querySelector('.seg');
        const status = seg ? seg.dataset.status : (n.status || 'todo');
        const data = {
          name,
          assignee: form.assignee.value.trim(),
          startDate: form.startDate ? form.startDate.value : (n.startDate || ''),
          endDate: form.endDate ? form.endDate.value : (n.endDate || ''),
          status,
          note: form.note.value.trim(),
        };
        if (editing) {
          const predIds = isLeaf
            ? Array.from(form.querySelectorAll('input[name=pred]:checked')).map(i => i.value)
            : null;
          saveNode(editing.id, data, predIds);
        } else add(parentId, level, data);
      }
    });
  }

  function statusLabel(s) { return { todo: '未着手', doing: '進行中', done: '完了' }[s] || '未着手'; }

  // --- 変更操作 ---
  async function add(parentId, level, data) {
    History.snapshot();
    const siblings = childrenOf(parentId);
    const node = {
      id: uid('s'), projectId: state.project.id, parentId: parentId || null,
      order: siblings.length, ...data,
    };
    state.schedules.push(node);
    await DB.put('schedules', node, { action: 'add', label: `${LEVEL_NAME[level]}「${data.name}」を追加` });
    await Projects.touch();
    Store.setUiState({ selectedId: node.id }, []);
    afterChange();
  }

  async function saveNode(id, data, predIds) {
    History.snapshot();
    const node = byId(id);
    Object.assign(node, data);
    await DB.put('schedules', node, { action: 'edit', label: `「${node.name}」を編集` });
    await Projects.touch();
    if (predIds) await Dependencies.setPredecessors(id, predIds);
    await Dependencies.rescheduleFrom(id);
    afterChange();
  }

  // ドラッグ等からの日付更新(モーダルを介さない)。
  async function updateDates(id, startDate, endDate) {
    History.snapshot();
    const node = byId(id);
    node.startDate = startDate; node.endDate = endDate;
    await DB.put('schedules', node, { action: 'edit', label: `「${node.name}」の期間を変更` });
    await Projects.touch();
    await Dependencies.rescheduleFrom(id);
    afterChange();
  }

  async function setStatus(id, status) {
    History.snapshot();
    const node = byId(id);
    node.status = status;
    await DB.put('schedules', node, { action: 'edit', label: `「${node.name}」を${statusLabel(status)}に` });
    await Projects.touch();
    afterChange();
  }

  async function del(id) {
    const node = byId(id);
    const ok = await UI.confirm(`「${node.name}」${hasChildren(id) ? 'と、その配下すべて' : ''}を削除します。よろしいですか?`, { danger: true, okLabel: '削除' });
    if (!ok) return;
    History.snapshot();
    // 子孫を集める(自分自身は最後に別途 remove してログを残す)
    const descIds = [];
    (function collect(pid) { for (const c of state.schedules.filter(n => n.parentId === pid)) { descIds.push(c.id); collect(c.id); } })(id);
    const allIds = descIds.concat([id]);
    // 依存関係も掃除
    const deps = state.dependencies.filter(d => allIds.includes(d.fromId) || allIds.includes(d.toId));
    state.schedules = state.schedules.filter(n => !allIds.includes(n.id));
    state.dependencies = state.dependencies.filter(d => !allIds.includes(d.fromId) && !allIds.includes(d.toId));
    await DB.bulkRemove('schedules', descIds);
    await DB.bulkRemove('dependencies', deps.map(d => d.id));
    await DB.remove('schedules', id, { projectId: state.project.id, action: 'delete', label: `「${node.name}」を削除` });
    await Projects.touch();
    if (uiState.selectedId === id) Store.setUiState({ selectedId: null }, []);
    afterChange();
  }

  async function reorder(id, newParentId, newOrder) {
    History.snapshot();
    const node = byId(id);
    node.parentId = newParentId;
    node.order = newOrder;
    // 兄弟の order を詰め直す
    childrenOf(newParentId).forEach((n, i) => { n.order = i; });
    for (const n of childrenOf(newParentId)) await DB.put('schedules', n);
    await Projects.touch();
    afterChange();
  }

  function afterChange() {
    Store.renderAll();
  }

  return {
    childrenOf, byId, levelOf, hasChildren, computeNumbering, flattenForDisplay,
    effectiveStatus, effectiveSpan, renderTree, openEditor, add, saveNode, del, reorder,
    updateDates, setStatus, LEVEL_NAME, MAX_LEVEL, statusLabel,
  };
})();


// ===== app/dependencies.js =====
// ==== app/dependencies.js ====
// タスク同士の依存関係(先行→後続)。先行の日程が変わると後続を自動リスケジュールする。

const Dependencies = (() => {

  function leafTasks() {
    return state.schedules.filter(n => !Schedules.hasChildren(n.id));
  }

  function predecessorsOf(toId) {
    return state.dependencies.filter(d => d.toId === toId).map(d => d.fromId);
  }

  // fromId → toId を追加すると循環するか?
  function wouldCycle(fromId, toId) {
    // toId から辿って fromId に到達したら循環。
    const stack = [toId];
    const seen = new Set();
    while (stack.length) {
      const cur = stack.pop();
      if (cur === fromId) return true;
      if (seen.has(cur)) continue;
      seen.add(cur);
      for (const d of state.dependencies.filter(x => x.fromId === cur)) stack.push(d.toId);
    }
    return false;
  }

  // 後続タスク(toId)の先行集合を fromIds に一致させる。
  async function setPredecessors(toId, fromIds) {
    const current = state.dependencies.filter(d => d.toId === toId);
    // 削除
    for (const d of current) {
      if (!fromIds.includes(d.fromId)) {
        state.dependencies = state.dependencies.filter(x => x.id !== d.id);
        await DB.remove('dependencies', d.id);
      }
    }
    // 追加
    for (const fromId of fromIds) {
      if (fromId === toId) continue;
      if (current.some(d => d.fromId === fromId)) continue;
      if (wouldCycle(fromId, toId)) { toast('循環する依存関係は設定できません'); continue; }
      const dep = { id: uid('d'), projectId: state.project.id, fromId, toId };
      state.dependencies.push(dep);
      await DB.put('dependencies', dep);
    }
    // 先行の終了に合わせて後続を寄せる
    for (const fromId of fromIds) await rescheduleFrom(fromId);
  }

  // nodeId(先行)の日程変更を後続へ波及。循環は visited で防止。
  async function rescheduleFrom(nodeId, visited) {
    visited = visited || new Set();
    if (visited.has(nodeId)) return;
    visited.add(nodeId);
    const from = Schedules.byId(nodeId);
    if (!from) return;
    const fromEnd = parseDate(from.endDate);
    if (!fromEnd) return;
    for (const d of state.dependencies.filter(x => x.fromId === nodeId)) {
      const to = Schedules.byId(d.toId);
      if (!to) continue;
      const earliest = Holidays.nextWorkingDay(addDays(fromEnd, 1));
      const toStart = parseDate(to.startDate);
      if (!toStart || dayDiff(earliest, toStart) < 0) {
        const dur = (to.startDate && to.endDate)
          ? Math.max(1, Holidays.countWorkingDays(parseDate(to.startDate), parseDate(to.endDate))) : 1;
        to.startDate = fmtDate(earliest);
        to.endDate = fmtDate(Holidays.endAfterWorkingDays(earliest, dur));
        await DB.put('schedules', to);
        await rescheduleFrom(to.id, visited);
      }
    }
  }

  return { leafTasks, predecessorsOf, wouldCycle, setPredecessors, rescheduleFrom };
})();


// ===== app/tasks.js =====
// ==== app/tasks.js ====
// タスク管理画面(サブスケジュールから開くサイドパネル)。
// タスクはガント本体にも表示されるが、このパネルでは一覧で手早く追加・編集・状態変更・削除できる。
// データ変更は Store.renderAll を経由するため、このパネルは購読(refresh)で自動更新される。

const TaskPanel = (() => {
  let openSubId = null;

  function open(subId) {
    openSubId = subId;
    UI.openPanel(`
      <div class="panel-head">
        <h2>タスク管理</h2>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <div class="panel-sub" id="taskPanelSub"></div>
      <div class="panel-body" id="taskPanelBody"></div>
      <div class="panel-foot"><button class="btn primary" id="taskAddBtn" style="width:100%">＋ タスクを追加</button></div>
    `, {
      onOpen(panel) {
        const body = panel.querySelector('#taskPanelBody');
        body.addEventListener('click', (e) => {
          const taskEl = e.target.closest('[data-task]');
          if (!taskEl) return;
          const st = e.target.closest('[data-st]');
          if (st) { Schedules.setStatus(taskEl.dataset.task, st.dataset.st); return; }
          if (e.target.closest('[data-edit]')) { Schedules.openEditor({ id: taskEl.dataset.task }); return; }
          if (e.target.closest('[data-del]')) { Schedules.del(taskEl.dataset.task); return; }
        });
        panel.querySelector('#taskAddBtn').onclick = () =>
          Schedules.openEditor({ parentId: openSubId, level: 2 });
        renderBody();
      }
    });
  }

  function renderBody() {
    const body = document.getElementById('taskPanelBody');
    const sub = document.getElementById('taskPanelSub');
    if (!body || !sub) return;
    const s = Schedules.byId(openSubId);
    if (!s) { sub.innerHTML = '<div class="tp-subname">(削除されました)</div>'; body.innerHTML = ''; return; }
    sub.innerHTML = `<div class="tp-subname">${escapeHtml(s.name)}</div>
      <div class="tp-hint">このサブスケジュールに属するタスクを管理します。状態の○は左から 未着手 / 進行中 / 完了。</div>`;
    const tasks = Schedules.childrenOf(openSubId);
    if (!tasks.length) {
      body.innerHTML = `<p class="tp-empty">まだタスクがありません。<br>下の「＋ タスクを追加」から作りましょう。</p>`;
      return;
    }
    body.innerHTML = tasks.map(t => {
      const st = t.status || 'todo';
      const span = (t.startDate && t.endDate) ? `${t.startDate} 〜 ${t.endDate}` : '期間未設定';
      return `<div class="tp-task" data-task="${t.id}">
        <div class="seg-mini">
          <button data-st="todo" class="todo ${st === 'todo' ? 'on' : ''}" title="未着手"></button>
          <button data-st="doing" class="doing ${st === 'doing' ? 'on' : ''}" title="進行中"></button>
          <button data-st="done" class="done ${st === 'done' ? 'on' : ''}" title="完了"></button>
        </div>
        <div class="tp-main">
          <div class="tp-name">${escapeHtml(t.name)}</div>
          <div class="tp-meta">${escapeHtml(span)}${t.assignee ? ' ・ ' + escapeHtml(t.assignee) : ''}</div>
        </div>
        <div class="row-actions2">
          <button class="icon-btn" data-edit title="編集">✎</button>
          <button class="icon-btn" data-del title="削除">🗑</button>
        </div>
      </div>`;
    }).join('');
  }

  // Store の再レンダリングに追随してパネルを更新(データ変更時に自動反映)。
  function refresh() {
    if (!openSubId) return;
    const host = document.getElementById('panelHost');
    if (!host || host.classList.contains('hidden')) { openSubId = null; return; }
    renderBody();
  }

  return { open, refresh };
})();


// ===== app/milestones.js =====
// ==== app/milestones.js ====
// マイルストーン: 期間を持たない、特定日付の目印(納期・レビュー会など)。

const Milestones = (() => {

  function openEditor(id) {
    const editing = id ? state.milestones.find(m => m.id === id) : null;
    const assist = document.body.dataset.mode === 'assist';
    const m = editing || {};
    const h = UI.openModal(`
      <div class="modal-head"><h2>${editing ? 'マイルストーンを編集' : 'マイルストーンを追加'}</h2></div>
      <form>
        <div class="modal-body">
          <div class="field">
            <label>名称</label>
            <input name="name" value="${escapeHtml(m.name || '')}" autocomplete="off">
            ${assist ? '<span class="eg-hint">例: 納品、中間レビュー、リリース</span>' : ''}
          </div>
          <div class="field">
            <label>日付</label>
            <input type="date" name="date" value="${m.date || ''}">
          </div>
        </div>
        <div class="modal-foot">
          ${editing ? '<button type="button" class="btn danger" data-del>削除</button>' : ''}
          <button type="button" class="btn" data-close style="margin-left:auto">キャンセル</button>
          <button type="submit" class="btn primary">${editing ? '保存' : '追加'}</button>
        </div>
      </form>
    `, {
      onOpen(modal) {
        const delBtn = modal.querySelector('[data-del]');
        if (delBtn) delBtn.onclick = async () => { h.close(); await remove(editing.id); };
      },
      onSubmit(form) {
        const name = form.name.value.trim();
        const date = form.date.value;
        if (!name) { toast('名称を入力してください'); return false; }
        if (!date) { toast('日付を入力してください'); return false; }
        if (editing) save(editing.id, { name, date });
        else add({ name, date });
      }
    });
  }

  async function add(data) {
    History.snapshot();
    const m = { id: uid('m'), projectId: state.project.id, ...data };
    state.milestones.push(m);
    await DB.put('milestones', m, { action: 'add', label: `マイルストーン「${data.name}」を追加` });
    await Projects.touch();
    Store.renderAll();
  }

  async function save(id, data) {
    History.snapshot();
    const m = state.milestones.find(x => x.id === id);
    Object.assign(m, data);
    await DB.put('milestones', m, { action: 'edit', label: `マイルストーン「${m.name}」を編集` });
    await Projects.touch();
    Store.renderAll();
  }

  async function remove(id) {
    History.snapshot();
    const m = state.milestones.find(x => x.id === id);
    state.milestones = state.milestones.filter(x => x.id !== id);
    await DB.remove('milestones', id, { projectId: state.project.id, action: 'delete', label: `マイルストーン「${m ? m.name : ''}」を削除` });
    await Projects.touch();
    Store.renderAll();
  }

  return { openEditor, add, save, remove };
})();


// ===== app/gantt.js =====
// ==== app/gantt.js ====
// 日付↔ピクセル変換を集約し、ヘッダー目盛り・グリッド・バー・マイルストーン・今日線・依存線を描画。
// バーはドラッグで移動/期間変更でき、フォーム編集(schedules.js)と同じデータを更新する。

const Gantt = (() => {
  const PX_PER_DAY = { day: 30, week: 16, month: 7, quarter: 3.5 };
  const ROW_H = 38;

  // 現在の描画スケール(ドラッグ時の逆変換に使う)。
  let scale = { origin: null, pxPerDay: 30, width: 0 };

  function computeDateScale() {
    const pxPerDay = PX_PER_DAY[uiState.granularity] || 30;
    let min = null, max = null;
    for (const n of state.schedules) {
      if (Schedules.hasChildren(n.id)) continue; // 葉のみ実日付を持つ
      const sp = Schedules.effectiveSpan(n);
      if (!sp) continue;
      if (!min || sp.start < min) min = sp.start;
      if (!max || sp.end > max) max = sp.end;
    }
    for (const m of state.milestones) {
      const d = parseDate(m.date);
      if (!d) continue;
      if (!min || d < min) min = d;
      if (!max || d > max) max = d;
    }
    const today = todayDate();
    if (!min) { min = addDays(today, -7); max = addDays(today, 30); }
    if (!max || max < min) max = addDays(min, 14);
    // 前後に余白。開始は週頭(月曜)に丸める。
    let origin = addDays(min, -3);
    while (origin.getDay() !== 1) origin = addDays(origin, -1);
    const end = addDays(max, 10);
    const days = dayDiff(origin, end) + 1;
    const width = Math.max(days * pxPerDay, 600);
    scale = { origin, pxPerDay, width, end };
    return scale;
  }

  function dateToX(d) { return dayDiff(scale.origin, d) * scale.pxPerDay; }
  function xToDate(x) { return addDays(scale.origin, Math.round(x / scale.pxPerDay)); }

  // --- ヘッダー目盛り ---
  function renderScale() {
    const g = uiState.granularity;
    const ticks = [];
    let d = new Date(scale.origin.getFullYear(), scale.origin.getMonth(), scale.origin.getDate());
    const end = scale.end;
    while (dayDiff(d, end) >= 0) {
      let show = false, major = false, label = '', sub = '';
      if (g === 'day') {
        show = true;
        major = d.getDate() === 1;
        label = major ? `${d.getMonth() + 1}月` : '';
        sub = String(d.getDate());
      } else if (g === 'week') {
        if (d.getDay() === 1) { show = true; major = d.getDate() <= 7; label = major ? `${d.getMonth() + 1}月` : ''; sub = `${d.getMonth() + 1}/${d.getDate()}`; }
      } else if (g === 'month') {
        if (d.getDate() === 1) { show = true; major = d.getMonth() === 0; label = major ? `${d.getFullYear()}` : ''; sub = `${d.getMonth() + 1}月`; }
      } else if (g === 'quarter') {
        if (d.getDate() === 1 && d.getMonth() % 3 === 0) { show = true; major = d.getMonth() === 0; label = major ? `${d.getFullYear()}` : ''; sub = `Q${Math.floor(d.getMonth() / 3) + 1}`; }
      }
      if (show) ticks.push(`<div class="scale-tick ${major ? 'major' : ''}" style="left:${dateToX(d)}px">${label}<span class="sub">${sub}</span></div>`);
      d = addDays(d, 1);
    }
    return `<div class="gantt-scale" style="width:${scale.width}px">${ticks.join('')}</div>`;
  }

  // --- グリッド(縦線・週末/祝日シェード・今日線)---
  function renderGridDecor(totalH) {
    const g = uiState.granularity;
    const parts = [];
    let d = new Date(scale.origin.getFullYear(), scale.origin.getMonth(), scale.origin.getDate());
    const end = scale.end;
    const showWeekendShade = (g === 'day' || g === 'week');
    while (dayDiff(d, end) >= 0) {
      const x = dateToX(d);
      // 縦グリッド線
      let line = false, major = false;
      if (g === 'day') { line = true; major = d.getDay() === 1; }
      else if (g === 'week') { line = d.getDay() === 1; major = d.getDate() <= 7; }
      else if (g === 'month') { line = d.getDate() === 1; major = d.getMonth() === 0; }
      else if (g === 'quarter') { line = d.getDate() === 1 && d.getMonth() % 3 === 0; major = d.getMonth() === 0; }
      if (line) parts.push(`<div class="grid-line ${major ? 'major' : ''}" style="left:${x}px"></div>`);
      // 週末/祝日シェード(日・週表示のみ)
      if (showWeekendShade) {
        if (isWeekend(d)) parts.push(`<div class="grid-weekend" style="left:${x}px;width:${scale.pxPerDay}px"></div>`);
        else if (Holidays.isHoliday(d)) parts.push(`<div class="grid-holiday" style="left:${x}px;width:${scale.pxPerDay}px"></div>`);
      }
      d = addDays(d, 1);
    }
    // 今日線
    const today = todayDate();
    if (dayDiff(scale.origin, today) >= 0 && dayDiff(today, scale.end) >= 0) {
      const tx = dateToX(today) + scale.pxPerDay / 2;
      parts.push(`<div class="today-flag" style="left:${tx}px">今日</div>`);
      parts.push(`<div class="today-line" style="left:${tx}px;height:${totalH}px"></div>`);
    }
    return parts.join('');
  }

  // --- バー行 ---
  // 色・太さは階層(レベル)だけで決める: スケジュール(lv0)=テーマ色・最太、
  // サブスケジュール(lv1)=グレー・中太、タスク(lv2)=ステータス濃淡・最細。
  // 子を持つかどうかは「集計値(summary)を出すか、自分の日程を直接ドラッグできるか」だけに影響する。
  function renderRows(rows) {
    return rows.map(r => {
      const n = r.node;
      const sp = Schedules.effectiveSpan(n);
      let bar = '';
      if (sp) {
        const left = dateToX(sp.start);
        const width = Math.max((dayDiff(sp.start, sp.end) + 1) * scale.pxPerDay, 6);
        const draggable = !r.hasChildren;
        if (r.level === 2) {
          // タスク(常に葉): ステータス濃淡・最細・ドラッグ可。
          const st = Schedules.effectiveStatus(n);
          const label = width > 40 ? `<span class="bar-label">${escapeHtml(n.name)}</span>` : '';
          bar = `<div class="bar lv2 ${st}" data-bar="${n.id}" style="left:${left}px;width:${width}px" title="${escapeHtml(n.name)}">
                   <span class="grip left"></span>${label}<span class="grip right"></span>
                 </div>`;
        } else {
          // スケジュール/サブスケジュール: レベル色。子が無ければ自身の日程を直接ドラッグできる。
          const lv = r.level === 0 ? 'lv0' : 'lv1';
          const label = `<span class="bar-label">${escapeHtml(n.name)}</span>`;
          if (draggable) {
            bar = `<div class="bar ${lv}" data-bar="${n.id}" style="left:${left}px;width:${width}px" title="${escapeHtml(n.name)}">
                     <span class="grip left"></span>${label}<span class="grip right"></span>
                   </div>`;
          } else {
            bar = `<div class="bar summary ${lv}" style="left:${left}px;width:${width}px">${label}</div>`;
          }
        }
      }
      return `<div class="gantt-row ${uiState.selectedId === n.id ? 'selected' : ''}" data-row="${n.id}">${bar}</div>`;
    }).join('');
  }

  // --- マイルストーン ---
  // 今日線と同じく、チャートを縦に貫く線として描画する(行数やスクロール位置に関係なく見える)。
  function renderMilestones(totalH) {
    return state.milestones.map(m => {
      const d = parseDate(m.date);
      if (!d || dayDiff(scale.origin, d) < 0 || dayDiff(d, scale.end) > 0) return '';
      const x = dateToX(d) + scale.pxPerDay / 2;
      return `<div class="milestone-line" style="left:${x}px;height:${totalH}px"></div>
              <button type="button" class="milestone-flag" data-ms="${m.id}" style="left:${x}px" title="${escapeHtml(m.name)} (${m.date})">◆ ${escapeHtml(m.name)}</button>`;
    }).join('');
  }

  // --- 依存線 ---
  function renderDeps(rows) {
    const rowIndex = {};
    rows.forEach((r, i) => { rowIndex[r.node.id] = i; });
    const segs = [];
    for (const dep of state.dependencies) {
      const fi = rowIndex[dep.fromId], ti = rowIndex[dep.toId];
      if (fi == null || ti == null) continue; // 折りたたみ等で非表示
      const from = Schedules.byId(dep.fromId), to = Schedules.byId(dep.toId);
      const fsp = Schedules.effectiveSpan(from), tsp = Schedules.effectiveSpan(to);
      if (!fsp || !tsp) continue;
      const x1 = dateToX(fsp.end) + scale.pxPerDay; // from バーの右端
      const y1 = fi * ROW_H + ROW_H / 2;
      const x2 = dateToX(tsp.start);
      const y2 = ti * ROW_H + ROW_H / 2;
      const midX = Math.max(x1 + 12, x2 - 12);
      segs.push(`<path class="dep-path" d="M${x1},${y1} H${midX} V${y2} H${x2}"/>
                 <path class="dep-arrow" d="M${x2},${y2} l-6,-4 v8 z"/>`);
    }
    return segs.join('');
  }

  function renderGantt() {
    const header = document.getElementById('ganttHeader');
    const body = document.getElementById('ganttBody');
    if (!state.project) { header.innerHTML = ''; body.innerHTML = ''; return; }
    computeDateScale();
    const rows = Schedules.flattenForDisplay();
    header.innerHTML = renderScale();

    if (!rows.length) {
      body.innerHTML = `<div class="gantt-empty">左でスケジュールを追加すると、ここにガントチャートが表示されます。</div>`;
      return;
    }
    const totalH = rows.length * ROW_H;
    body.innerHTML = `
      <div class="gantt-grid" style="width:${scale.width}px;height:${totalH}px;position:relative">
        ${renderGridDecor(totalH)}
        <div class="gantt-rows">${renderRows(rows)}</div>
        <svg id="depSvg" width="${scale.width}" height="${totalH}">${renderDeps(rows)}</svg>
        ${renderMilestones(totalH)}
      </div>`;
  }

  // --- ドラッグ(移動 / 期間変更)---
  function beginDrag(e, barEl) {
    const id = barEl.dataset.bar;
    const node = Schedules.byId(id);
    if (!node) return;
    const sp = Schedules.effectiveSpan(node);
    if (!sp) return;
    const mode = e.target.classList.contains('grip')
      ? (e.target.classList.contains('left') ? 'resize-l' : 'resize-r')
      : 'move';
    const startX = e.clientX;
    const origStart = sp.start, origEnd = sp.end;
    const durDays = dayDiff(origStart, origEnd);
    e.preventDefault();
    document.body.style.cursor = mode === 'move' ? 'grabbing' : 'ew-resize';
    barEl.classList.add('dragging');

    // ドラッグ中の日付ツールチップ
    const tip = document.createElement('div');
    tip.className = 'drag-tip';
    document.body.appendChild(tip);
    function showTip(ev, ns, ne) {
      tip.textContent = `${fmtDate(ns)} 〜 ${fmtDate(ne)}(${Holidays.countWorkingDays(ns, ne)}稼働日)`;
      tip.style.left = (ev.clientX + 14) + 'px';
      tip.style.top = (ev.clientY + 16) + 'px';
    }

    function onMove(ev) {
      const deltaDays = Math.round((ev.clientX - startX) / scale.pxPerDay);
      let ns = origStart, ne = origEnd;
      if (mode === 'move') { ns = addDays(origStart, deltaDays); ne = addDays(origEnd, deltaDays); }
      else if (mode === 'resize-l') { ns = addDays(origStart, deltaDays); if (dayDiff(ns, ne) < 0) ns = ne; }
      else if (mode === 'resize-r') { ne = addDays(origEnd, deltaDays); if (dayDiff(ns, ne) < 0) ne = ns; }
      barEl.style.left = dateToX(ns) + 'px';
      barEl.style.width = Math.max((dayDiff(ns, ne) + 1) * scale.pxPerDay, 6) + 'px';
      barEl._pending = { start: fmtDate(ns), end: fmtDate(ne) };
      showTip(ev, ns, ne);
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.cursor = '';
      barEl.classList.remove('dragging');
      tip.remove();
      const p = barEl._pending;
      if (p && (p.start !== fmtDate(origStart) || p.end !== fmtDate(origEnd))) {
        Schedules.updateDates(id, p.start, p.end);
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  return { renderGantt, computeDateScale, dateToX, xToDate, beginDrag, ROW_H };
})();


// ===== app/assist.js =====
// ==== app/assist.js ====
// アシストモードの「次にやることガイド」(常設サイドパネルのチェックリスト)とテンプレート。

const Assist = (() => {

  const TEMPLATES = {
    teamdev: {
      title: 'チーム開発',
      desc: '定義 / 設計 / 実装 / フォロー',
      phases: [
        { name: '定義', subs: [
          { name: '要件定義', tasks: ['ヒアリング', '要求一覧作成'] },
        ] },
        { name: '設計', subs: [
          { name: '基本設計', tasks: ['画面・データ設計'] },
        ] },
        { name: '実装', subs: [
          { name: '実装', tasks: ['実装', 'コードレビュー'] },
        ] },
        { name: 'フォロー', subs: [
          { name: 'テスト・リリース', tasks: ['受入テスト'] },
        ] },
      ],
    },
  };

  function templateList() {
    return Object.keys(TEMPLATES).map(k => ({ key: k, ...TEMPLATES[k] }));
  }

  // テンプレートから schedules を DB に直接書き込む(select() 前に呼ばれる)。
  async function applyTemplate(projectId, key) {
    const tpl = TEMPLATES[key];
    if (!tpl) return;
    let cursor = Holidays.nextWorkingDay(todayDate());
    let po = 0;
    for (const phase of tpl.phases) {
      const pid = uid('s');
      await DB.put('schedules', { id: pid, projectId, parentId: null, order: po++, name: phase.name, status: 'todo', assignee: '', startDate: '', endDate: '', note: '' });
      let so = 0;
      for (const sub of phase.subs) {
        const sid = uid('s');
        await DB.put('schedules', { id: sid, projectId, parentId: pid, order: so++, name: sub.name, status: 'todo', assignee: '', startDate: '', endDate: '', note: '' });
        let to = 0;
        for (const taskName of (sub.tasks || [])) {
          const start = cursor;
          const end = Holidays.endAfterWorkingDays(start, 3);
          await DB.put('schedules', { id: uid('s'), projectId, parentId: sid, order: to++, name: taskName, status: 'todo', assignee: '', startDate: fmtDate(start), endDate: fmtDate(end), note: '' });
          cursor = Holidays.nextWorkingDay(addDays(end, 1));
        }
      }
    }
  }

  // --- ガイド ---
  function steps() {
    const lv0 = state.schedules.some(n => Schedules.levelOf(n) === 0);
    const lv1 = state.schedules.some(n => Schedules.levelOf(n) === 1);
    const lv2 = state.schedules.some(n => Schedules.levelOf(n) === 2);
    const hasDates = state.schedules.some(n => !Schedules.hasChildren(n.id) && n.startDate && n.endDate);
    const hasMs = state.milestones.length > 0;
    return [
      { done: lv0, title: '1. スケジュールを書く', body: 'まずは大きな流れ(フェーズ)を並べましょう。', eg: '例: 定義 / 設計 / 実装 / フォロー' },
      { done: lv1, title: '2. サブスケジュールを追加', body: '各フェーズの中身を、成果物・工程の単位で分けます。', eg: '例:「定義」→ 機能要件定義 / 非機能要件定義' },
      { done: lv2, title: '3. タスクを設定', body: '実際に手を動かす単位まで分解します。', eg: '例:「機能要件定義」→ ヒアリング / 要求一覧作成' },
      { done: hasDates, title: '4. 期間を入れる', body: 'タスクに開始日と期間(稼働日)を入れると、バーが表示されます。', eg: '土日・祝日は自動で除外されます' },
      { done: hasMs, title: '5. マイルストーンを置く(任意)', body: '納期やレビュー会などの目印を立てましょう。', eg: 'クリックでマイルストーンを追加' },
    ];
  }

  // ガイド項目クリック時の動作。もっとも役立つモーダルを開く。
  function runStep(i) {
    if (i === 0) { Schedules.openEditor({ parentId: null, level: 0 }); return; }
    if (i === 1) {
      const s0 = state.schedules.find(n => Schedules.levelOf(n) === 0);
      if (s0) Schedules.openEditor({ parentId: s0.id, level: 1 });
      else { toast('先に「スケジュール」を追加しましょう'); Schedules.openEditor({ parentId: null, level: 0 }); }
      return;
    }
    if (i === 2) {
      const s1 = state.schedules.find(n => Schedules.levelOf(n) === 1);
      if (s1) Schedules.openEditor({ parentId: s1.id, level: 2 });
      else toast('先に「サブスケジュール」を追加しましょう');
      return;
    }
    if (i === 3) {
      const leaf = state.schedules.find(n => !Schedules.hasChildren(n.id) && (!n.startDate || !n.endDate));
      if (leaf) Schedules.openEditor({ id: leaf.id });
      else toast('すべてのタスクに期間が入っています');
      return;
    }
    if (i === 4) { Milestones.openEditor(null); return; }
  }

  function renderAssist() {
    const host = document.getElementById('assistGuide');
    if (document.body.dataset.mode !== 'assist' || !state.project) { host.innerHTML = ''; return; }
    const list = steps();
    const activeIdx = list.findIndex(s => !s.done);
    host.innerHTML = `
      <div class="assist-head">
        <h2>次にやること</h2>
        <p>この順に進めれば、迷わずスケジュールが完成します。</p>
      </div>
      <div class="guide-steps">
        ${list.map((s, i) => `
          <button type="button" class="guide-step ${s.done ? 'done' : ''} ${i === activeIdx ? 'active' : ''}" data-step="${i}">
            <span class="guide-check">✓</span>
            <div class="guide-body">
              <h3>${escapeHtml(s.title)}</h3>
              <p>${escapeHtml(s.body)}</p>
              <span class="eg">${escapeHtml(s.eg)}</span>
            </div>
            <span class="go">›</span>
          </button>`).join('')}
      </div>
      <div class="assist-tip">迷ったら、上の見本の言葉をそのまま真似して大丈夫。あとから何度でも直せます。</div>
    `;
  }

  return { templateList, applyTemplate, renderAssist, runStep };
})();


// ===== app/exportimport.js =====
// ==== app/exportimport.js ====
// JSON エクスポート/インポート(バックアップ・復元用)と、印刷による PDF/画像出力(共有用)。

const ExportImport = (() => {

  function openMenu() {
    UI.openModal(`
      <div class="modal-head"><h2>出力 / バックアップ</h2></div>
      <div class="modal-body">
        <div class="field">
          <label>共有用(閲覧のために書き出す)</label>
          <button type="button" class="btn" data-act="print" style="width:100%">🖨 印刷 / PDF・画像として保存</button>
          <span class="eg-hint">ブラウザの印刷ダイアログから「PDFに保存」を選べます。上司・チームへの共有に。</span>
        </div>
        <div class="field">
          <label>バックアップ用(このプロジェクトのデータ全体)</label>
          <button type="button" class="btn" data-act="json-out" style="width:100%;margin-bottom:8px">⬇ JSONファイルに書き出す</button>
          <button type="button" class="btn" data-act="json-in" style="width:100%">⬆ JSONファイルから読み込む(新規プロジェクトとして)</button>
          <span class="eg-hint">ブラウザのデータ消失に備えた保存・復元用です。</span>
        </div>
        <input type="file" accept="application/json,.json" data-file hidden>
      </div>
      <div class="modal-foot"><button type="button" class="btn" data-close>閉じる</button></div>
    `, {
      onOpen(modal) {
        const fileIn = modal.querySelector('[data-file]');
        modal.querySelector('[data-act="print"]').onclick = () => { window.print(); };
        modal.querySelector('[data-act="json-out"]').onclick = () => exportJson();
        modal.querySelector('[data-act="json-in"]').onclick = () => fileIn.click();
        fileIn.onchange = () => { if (fileIn.files[0]) importJson(fileIn.files[0]); };
      }
    });
  }

  function exportJson() {
    if (!state.project) return;
    const data = {
      app: 'GanttChart', version: 1, exportedAt: new Date().toISOString(),
      project: { name: state.project.name, mode: state.project.mode },
      schedules: state.schedules,
      milestones: state.milestones,
      dependencies: state.dependencies,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${state.project.name || 'gantt'}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('JSONを書き出しました');
  }

  async function importJson(file) {
    let data;
    try { data = JSON.parse(await file.text()); }
    catch { toast('JSONの読み込みに失敗しました'); return; }
    if (!data || data.app !== 'GanttChart' || !Array.isArray(data.schedules)) {
      toast('GanttChart のファイルではありません'); return;
    }
    const now = Date.now();
    const projectId = uid('p');
    const project = { id: projectId, name: (data.project && data.project.name || '読み込んだプロジェクト') + '(復元)', mode: (data.project && data.project.mode) || 'assist', createdAt: now, updatedAt: now };
    await DB.put('projects', project);

    // id を振り直して参照を張り替える。
    const idMap = {};
    for (const n of data.schedules) idMap[n.id] = uid('s');
    for (const n of data.schedules) {
      await DB.put('schedules', { ...n, id: idMap[n.id], projectId, parentId: n.parentId ? (idMap[n.parentId] || null) : null });
    }
    for (const m of (data.milestones || [])) {
      await DB.put('milestones', { ...m, id: uid('m'), projectId });
    }
    for (const d of (data.dependencies || [])) {
      if (!idMap[d.fromId] || !idMap[d.toId]) continue;
      await DB.put('dependencies', { id: uid('d'), projectId, fromId: idMap[d.fromId], toId: idMap[d.toId] });
    }
    document.getElementById('modalHost').classList.add('hidden');
    document.getElementById('modalHost').innerHTML = '';
    await Projects.loadAll();
    await Projects.select(projectId);
    toast('読み込みました');
  }

  return { openMenu, exportJson, importJson };
})();


// ===== app/history.js =====
// ==== app/history.js ====
// 元に戻す(undo)と変更履歴の表示。
// undo は「選択中プロジェクトのドメイン配列のスナップショット」を積み、復元する簡潔な方式。

const History = (() => {
  const MAX = 40;

  // 変更の直前に呼ぶ。現在のドメイン状態を deep copy して積む。
  function snapshot() {
    const snap = {
      schedules: state.schedules.map(x => ({ ...x })),
      milestones: state.milestones.map(x => ({ ...x })),
      dependencies: state.dependencies.map(x => ({ ...x })),
    };
    const stack = uiState.undoStack.slice();
    stack.push(snap);
    if (stack.length > MAX) stack.shift();
    Store.setUiState({ undoStack: stack }, ['header']);
  }

  function canUndo() { return uiState.undoStack.length > 0; }

  async function undo() {
    const stack = uiState.undoStack.slice();
    const snap = stack.pop();
    if (!snap) return;
    Store.setUiState({ undoStack: stack }, []);

    // DB を現在の内容から差し替える: 一旦プロジェクトの3ドメインを消して、スナップショットを書き戻す。
    const pid = state.project.id;
    for (const store of ['schedules', 'milestones', 'dependencies']) {
      const cur = await DB.getAllByProject(store, pid);
      await DB.bulkRemove(store, cur.map(r => r.id));
    }
    for (const n of snap.schedules) await DB.put('schedules', n);
    for (const m of snap.milestones) await DB.put('milestones', m);
    for (const d of snap.dependencies) await DB.put('dependencies', d);

    state.schedules = snap.schedules;
    state.milestones = snap.milestones;
    state.dependencies = snap.dependencies;
    await Projects.touch();
    toast('元に戻しました');
    Store.renderAll();
  }

  async function openPanel() {
    // 履歴ログを最新の状態で読み直す(変更のたびに state を更新していないため)。
    const fresh = await DB.getAllByProject('historyLog', state.project.id);
    fresh.sort((a, b) => b.at - a.at);
    Store.setState({ history: fresh }, []);
    const items = fresh.length
      ? fresh.map(h => `
          <div class="hist-item">
            <span class="when">${new Date(h.at).toLocaleString('ja-JP')}</span><br>
            <span class="what">${escapeHtml(h.label || h.action)}</span>
          </div>`).join('')
      : '<p style="color:var(--text-faint)">まだ変更履歴はありません。</p>';
    UI.openPanel(`
      <div class="panel-head"><h2>変更履歴</h2><button class="icon-btn" data-close>✕</button></div>
      <div class="panel-body">${items}</div>
    `);
  }

  async function refresh() {
    if (!state.project) return;
    const fresh = await DB.getAllByProject('historyLog', state.project.id);
    fresh.sort((a, b) => b.at - a.at);
    Store.setState({ history: fresh }, []);
  }

  return { snapshot, canUndo, undo, openPanel, refresh };
})();


// ===== app/main.js =====
// ==== app/main.js ====
// 全体の配線。DOMContentLoaded で一度だけ初期化・イベント委譲を行う。

async function init() {
  await DB.open();

  // レンダー関数をタグで購読(main で一度だけ配線)。
  Store.subscribe(['header'], renderHeader);
  Store.subscribe(['tree'], Schedules.renderTree);
  Store.subscribe(['gantt'], Gantt.renderGantt);
  Store.subscribe(['assist'], Assist.renderAssist);
  Store.subscribe(['gantt', 'tree'], renderProgress);
  Store.subscribe(['gantt', 'tree'], TaskPanel.refresh);

  wireHeader();
  wireTree();
  wireGantt();
  wireAssist();
  wireScrollSync();
  wireKeyboard();

  await Projects.loadAll();
  const id = await Projects.ensureOne();
  await Projects.select(id);
}

// ---- ヘッダー描画 ----
function renderHeader() {
  const sel = document.getElementById('projectSelect');
  sel.innerHTML = state.projects.map(p =>
    `<option value="${p.id}" ${state.project && p.id === state.project.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
  ).join('');
  document.getElementById('granularitySelect').value = uiState.granularity;
  document.getElementById('undoBtn').disabled = !History.canUndo();
}

// ---- 全体の進捗バー ----
function renderProgress() {
  const strip = document.getElementById('progressStrip');
  const legend = `<span class="pr-sub">
      <span class="status-dot todo"></span>未着手
      <span class="status-dot doing" style="margin-left:8px"></span>進行中
      <span class="status-dot done" style="margin-left:8px"></span>完了</span>`;
  if (!state.project) { strip.className = 'progress-strip hidden'; strip.innerHTML = ''; return; }
  const leaves = state.schedules.filter(n => !Schedules.hasChildren(n.id));
  strip.className = 'progress-strip';
  if (!leaves.length) {
    strip.innerHTML = `<span class="pr-label">全体の進捗</span>
      <div class="pr-track"><div class="pr-fill" style="width:0%"></div></div>
      <span class="pr-pct">–</span><span class="pr-sub">タスクを追加すると進捗が表示されます</span>`;
    return;
  }
  let sum = 0, done = 0;
  for (const l of leaves) {
    const s = Schedules.effectiveStatus(l);
    sum += s === 'done' ? 1 : s === 'doing' ? 0.5 : 0;
    if (s === 'done') done++;
  }
  const pct = Math.round(sum / leaves.length * 100);
  strip.innerHTML = `<span class="pr-label">全体の進捗</span>
    <div class="pr-track"><div class="pr-fill" style="width:${pct}%"></div></div>
    <span class="pr-pct">${pct}%</span>
    <span class="pr-sub">タスク ${done}/${leaves.length} 完了</span>
    ${legend}`;
}

// ---- ヘッダー操作 ----
function wireHeader() {
  document.getElementById('projectSelect').onchange = (e) => Projects.select(e.target.value);
  document.getElementById('newProjectBtn').onclick = openNewProjectDialog;
  document.getElementById('projectMenuBtn').onclick = openProjectSettings;
  document.getElementById('modeToggle').onclick = (e) => {
    const btn = e.target.closest('[data-mode]');
    if (btn) Projects.setMode(btn.dataset.mode);
  };
  document.getElementById('granularitySelect').onchange = (e) => {
    Store.setUiState({ granularity: e.target.value }, []);
    Gantt.renderGantt();
  };
  document.getElementById('addScheduleBtn').onclick = () => Schedules.openEditor({ parentId: null, level: 0 });
  document.getElementById('addMilestoneBtn').onclick = () => Milestones.openEditor(null);
  document.getElementById('undoBtn').onclick = () => History.undo();
  document.getElementById('historyBtn').onclick = () => History.openPanel();
  document.getElementById('exportBtn').onclick = () => ExportImport.openMenu();
}

// ---- ツリー(イベント委譲)----
function wireTree() {
  const list = document.getElementById('treeList');
  list.addEventListener('click', (e) => {
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      const id = toggle.dataset.toggle;
      const collapsed = { ...uiState.collapsed, [id]: !uiState.collapsed[id] };
      Store.setUiState({ collapsed }, []);
      Schedules.renderTree(); Gantt.renderGantt();
      return;
    }
    const addChild = e.target.closest('[data-addchild]');
    if (addChild) {
      const parent = Schedules.byId(addChild.dataset.addchild);
      Schedules.openEditor({ parentId: parent.id, level: Schedules.levelOf(parent) + 1 });
      return;
    }
    const tasks = e.target.closest('[data-tasks]');
    if (tasks) { TaskPanel.open(tasks.dataset.tasks); return; }
    const edit = e.target.closest('[data-edit]');
    if (edit) { Schedules.openEditor({ id: edit.dataset.edit }); return; }
    const del = e.target.closest('[data-del]');
    if (del) { Schedules.del(del.dataset.del); return; }
    const row = e.target.closest('[data-id]');
    if (row) selectNode(row.dataset.id);
  });
}

// ---- ガント(イベント委譲)----
function wireGantt() {
  const body = document.getElementById('ganttBody');
  body.addEventListener('mousedown', (e) => {
    const bar = e.target.closest('.bar[data-bar]');
    if (bar) { selectNode(bar.dataset.bar); Gantt.beginDrag(e, bar); }
  });
  body.addEventListener('click', (e) => {
    const ms = e.target.closest('[data-ms]');
    if (ms) { Milestones.openEditor(ms.dataset.ms); return; }
    const row = e.target.closest('[data-row]');
    if (row && !e.target.closest('.bar')) selectNode(row.dataset.row);
  });
  body.addEventListener('dblclick', (e) => {
    const bar = e.target.closest('.bar[data-bar]');
    if (bar) Schedules.openEditor({ id: bar.dataset.bar });
  });
}

function selectNode(id) {
  Store.setUiState({ selectedId: id }, []);
  Schedules.renderTree(); Gantt.renderGantt();
}

// ---- アシストガイド(項目クリックで対応モーダルを開く)----
function wireAssist() {
  document.getElementById('assistGuide').addEventListener('click', (e) => {
    const step = e.target.closest('[data-step]');
    if (step) Assist.runStep(parseInt(step.dataset.step, 10));
  });
}

// ---- プロジェクト設定(名称変更 / 削除)----
function openProjectSettings() {
  if (!state.project) return;
  const p = state.project;
  UI.openModal(`
    <div class="modal-head"><h2>プロジェクト設定</h2></div>
    <form>
      <div class="modal-body">
        <div class="field">
          <label>プロジェクト名</label>
          <input name="name" value="${escapeHtml(p.name)}" autocomplete="off">
        </div>
        <div class="field">
          <label>削除</label>
          <button type="button" class="btn danger" data-del style="width:100%">🗑 このプロジェクトを削除</button>
          <span class="eg-hint">このプロジェクトのスケジュール・マイルストーンなどがすべて消えます(元に戻せません)。</span>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" data-close>閉じる</button>
        <button type="submit" class="btn primary">名前を保存</button>
      </div>
    </form>
  `, {
    onOpen(modal) {
      modal.querySelector('[data-del]').onclick = async () => {
        const ok = await UI.confirm(`「${p.name}」を削除します。よろしいですか?`, { danger: true, okLabel: '削除' });
        if (!ok) return;
        await Projects.remove(p.id);
        toast('プロジェクトを削除しました');
      };
    },
    onSubmit(form) {
      const name = form.name.value.trim();
      if (!name) { toast('名前を入力してください'); return false; }
      Projects.rename(name);
    }
  });
}

// ---- スクロール同期 ----
function wireScrollSync() {
  const body = document.getElementById('ganttBody');
  const header = document.getElementById('ganttHeader');
  const tree = document.getElementById('treeList');
  let lock = false;
  body.addEventListener('scroll', () => {
    header.scrollLeft = body.scrollLeft;
    if (lock) return; lock = true;
    tree.scrollTop = body.scrollTop;
    lock = false;
  });
  tree.addEventListener('scroll', () => {
    if (lock) return; lock = true;
    body.scrollTop = tree.scrollTop;
    lock = false;
  });
}

// ---- キーボード ----
function wireKeyboard() {
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      // 入力中は無効
      const t = e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      e.preventDefault();
      History.undo();
    }
  });
}

// ---- 新規プロジェクト ----
function openNewProjectDialog() {
  const templates = Assist.templateList();
  UI.openModal(`
    <div class="modal-head"><h2>新しいプロジェクト</h2></div>
    <form>
      <div class="modal-body">
        <div class="field">
          <label>プロジェクト名</label>
          <input name="name" value="" placeholder="例: 新サービス開発" autocomplete="off">
        </div>
        <div class="field">
          <label>モード</label>
          <div class="seg" data-mode="assist">
            <button type="button" data-m="assist" class="on accent">アシスト(初学者向け・緑)</button>
            <button type="button" data-m="normal" class="">ノーマル(経験者向け・青)</button>
          </div>
        </div>
        <div class="field">
          <label>テンプレート</label>
          <div class="template-grid">
            ${templates.map(t => `
              <button type="button" class="template-card" data-tpl="${t.key}">
                <h4>${escapeHtml(t.title)}</h4><p>${escapeHtml(t.desc)}</p>
              </button>`).join('')}
            <button type="button" class="template-card" data-tpl="blank">
              <h4>空から始める</h4><p>何もない状態から自由に</p>
            </button>
          </div>
          <input type="hidden" name="template" value="${templates[0] ? templates[0].key : 'blank'}">
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" data-close>キャンセル</button>
        <button type="submit" class="btn primary">作成</button>
      </div>
    </form>
  `, {
    onOpen(modal) {
      const seg = modal.querySelector('.seg');
      seg.querySelectorAll('button').forEach(b => b.onclick = () => {
        seg.dataset.mode = b.dataset.m;
        seg.querySelectorAll('button').forEach(x => x.className = '');
        b.className = 'on accent';
      });
      const tplInput = modal.querySelector('[name=template]');
      const cards = modal.querySelectorAll('.template-card');
      function markTpl(key) { cards.forEach(c => c.style.borderColor = c.dataset.tpl === key ? 'var(--accent)' : ''); }
      markTpl(tplInput.value);
      cards.forEach(c => c.onclick = () => { tplInput.value = c.dataset.tpl; markTpl(c.dataset.tpl); });
    },
    onSubmit(form, modal) {
      const name = form.name.value.trim() || '新しいプロジェクト';
      const mode = modal.querySelector('.seg').dataset.mode;
      const tpl = form.template.value;
      Projects.create(name, mode, tpl);
    }
  });
}

document.addEventListener('DOMContentLoaded', init);

</script>
