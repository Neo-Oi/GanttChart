<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GanttChart</title>
  <!-- BUILD:STYLES -->
</head>
<body data-mode="assist">
  <!-- ダークモードの初期適用(描画前に反映してチラつきを防ぐ) -->
  <script>try{if(localStorage.getItem('ganttchart-theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
  <div id="app">
    <!-- ヘッダー -->
    <header id="appHeader">
      <div class="hd-left">
        <span class="hd-logo">GanttChart</span>
        <select id="projectSelect" class="hd-select" title="プロジェクトを切り替え"></select>
        <button id="newProjectBtn" class="hd-btn" title="新しいプロジェクト">＋ 新規</button>
        <button id="notesBtn" class="hd-btn" title="プロジェクトメモ(Markdown)">📝 メモ</button>
        <button id="projectMenuBtn" class="hd-btn" title="プロジェクト設定 / 削除">⚙</button>
      </div>
      <div class="hd-center">
        <div id="modeToggle" class="mode-toggle" title="モードを切り替え">
          <button data-mode="assist" class="mode-opt">アシスト</button>
          <button data-mode="normal" class="mode-opt">ノーマル</button>
        </div>
      </div>
      <div class="hd-right">
        <button id="addMilestoneBtn" class="hd-btn" title="マイルストーンを追加">＋ マイルストーン</button>
        <div id="granularityToggle" class="seg-toggle" title="表示粒度">
          <button data-gran="day" class="seg-opt">日</button>
          <button data-gran="week" class="seg-opt">週</button>
          <button data-gran="month" class="seg-opt">月</button>
          <button data-gran="quarter" class="seg-opt">四半期</button>
        </div>
        <button id="undoBtn" class="hd-btn" title="元に戻す (Ctrl+Z)" disabled>↶ 元に戻す</button>
        <button id="historyBtn" class="hd-btn" title="変更履歴">履歴</button>
        <button id="exportBtn" class="hd-btn" title="エクスポート / インポート / バックアップ">入出力</button>
        <button id="themeBtn" class="hd-btn" title="ライト / ダークの切り替え">🌙</button>
      </div>
    </header>

    <!-- 全体の進捗バー -->
    <div id="progressStrip" class="progress-strip"></div>

    <!-- 本体: 左=ツリー / 中=ガント / 右=アシストガイド -->
    <div id="appBody">
      <section id="treePane" class="pane">
        <div class="pane-toolbar">
          <button id="addScheduleBtn" class="tool-btn primary">＋ スケジュール</button>
          <span class="tree-legend">
            <span class="lvl-badge lv0">スケジュール</span>
            <span class="lvl-badge lv1">サブ</span>
            <span class="lvl-badge lv2">タスク</span>
          </span>
        </div>
        <div id="treeList" class="tree-list"></div>
      </section>

      <!-- スケジュール欄とガント欄の間の縦スクロールバー(両方を上下同期) -->
      <div id="vscroll" class="vscroll hidden"><div id="vscrollThumb" class="vscroll-thumb"></div></div>

      <section id="ganttPane" class="pane">
        <div id="ganttHeader" class="gantt-header"></div>
        <div id="ganttBody" class="gantt-body"></div>
      </section>

      <aside id="assistPane" class="pane assist-pane">
        <div id="assistGuide"></div>
      </aside>
    </div>

    <!-- プロジェクトメモ(非モーダル・背景をブロックしないドッキングパネル) -->
    <div id="notesFloatHost" class="notes-float hidden"></div>

    <!-- モーダル / トースト -->
    <div id="modalHost" class="modal-host hidden"></div>
    <div id="panelHost" class="panel-host hidden"></div>
    <div id="toastHost" class="toast-host"></div>
  </div>

  <!-- BUILD:VENDOR -->
  <!-- BUILD:APP -->
</body>
</html>
